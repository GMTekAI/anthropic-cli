name: Setup Go
description: 'Sets up Go environment with private modules'
inputs:
  app-id:
    required: false
    description: ID of the GitHub App that can read the Go SDK's staging repo
  private-key:
    required: false
    description: private key of the GitHub App that can read the Go SDK's staging repo
runs:
  using: composite
  steps:
    - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
      if: github.repository == 'anthropics/anthropic-sdk-cli-private'
      id: app-token
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: anthropics
        repositories: anthropic-sdk-go-private
        permission-contents: read

    - name: Configure Git for access to the Go SDK's staging repo
      if: github.repository == 'anthropics/anthropic-sdk-cli-private'
      shell: bash
      run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/anthropics/anthropic-sdk-go-private".insteadOf "https://github.com/anthropics/anthropic-sdk-go-private"

    - name: Setup go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: ./go.mod

    # todo(dmeadows): trying to disable this to see if running this before linking is what's causing caching issues. 
    # - name: Bootstrap
    #   shell: bash
    #   run: ./scripts/bootstrap
